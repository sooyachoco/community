<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘 하루 어땠어?</title><style>body{margin:0;background:#fbf4ec;color:#5a4437;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:90px}.top{height:64px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fbf4ec;z-index:2}.back{color:#8a7060;text-decoration:none;font-size:13px;font-weight:800}.top-title{position:absolute;left:50%;transform:translateX(-50%);font-size:19px;font-weight:900;white-space:nowrap}.hero{width:100%;aspect-ratio:2.25/1;overflow:hidden;line-height:0;cursor:pointer}.hero img{width:100%;height:100%;object-fit:cover;display:block}.hero:active{opacity:.9}.tabs{padding:16px 14px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.tab{height:50px;border:1px solid #f1e2d6;border-radius:17px;background:#fffaf6;color:#a18b7c;font-weight:900;font-size:13px}.tab.active{background:#ffe4e1;color:#e7777d}.tab[data-board="여기 가자!"]{background:#fff8df;color:#b28b43}.tab[data-board="여기 가자!"].active{background:#ffe9a8;color:#9b741e}.feed{padding:0 14px}.post{background:#fffdfa;border:1px solid #f1e2d6;border-radius:20px;padding:14px;margin-bottom:10px;cursor:pointer}.head{display:flex;align-items:center;gap:11px}.avatar{width:50px;height:50px;border-radius:15px;overflow:hidden;background:#f8e8d9}.avatar img{width:100%;height:100%;object-fit:cover}.author{font-size:13px;font-weight:900}.g{color:#e27b80}.s{color:#6f91c5}.place{color:#b28b43}.time{font-size:11px;color:#b09b8e;margin-top:2px}.title{font-size:17px;font-weight:800;margin-top:12px;line-height:1.4}.post-title-row{display:flex;align-items:flex-start;gap:10px}.post-title-row .title{flex:1;min-width:0}.comment-count{flex:0 0 auto;margin-top:14px;font-size:12px;font-weight:700;color:#b09b8e;text-align:right;min-width:12px}.post-link{font-size:12px;color:#b28b43;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.write{position:fixed;right:max(18px,calc((100vw - 520px)/2 + 18px));bottom:22px;width:58px;height:58px;border:0;border-radius:50%;background:#f58f92;color:white;font-size:24px;line-height:58px;padding:0;box-shadow:0 6px 18px #b86d7050;z-index:4}.empty{text-align:center;padding:40px;color:#a99284}.more{display:none;width:calc(100% - 28px);height:44px;margin:4px 14px 18px;border:1px solid #f1e2d6;border-radius:14px;background:#fffaf6;color:#9b8475;font-weight:800}.modal{display:none;position:fixed;inset:0;background:#0004;z-index:5;align-items:flex-end}.sheet{width:100%;max-width:520px;margin:auto;background:#fffaf6;border-radius:28px 28px 0 0;padding:20px 18px 25px;box-sizing:border-box;max-height:92vh;overflow:auto}.identity{align-items:center;justify-content:center;text-align:center;min-height:230px}.identity h2{margin:0 0 8px}.identity p{margin:0 0 20px;color:#a18b7c;font-size:13px}.identity-buttons{display:flex;gap:10px}.identity-buttons button{flex:1;height:58px;border:1px solid #f1e2d6;border-radius:17px;background:white;font-weight:900;font-size:16px}.identity-buttons button:first-child{color:#e27b80}.identity-buttons button:last-child{color:#6f91c5}.row{display:flex;justify-content:space-between;align-items:center}.row button{border:0;background:none;font-size:24px;color:#8c7567}.field{width:100%;box-sizing:border-box;border:1px solid #f1e2d6;border-radius:15px;padding:13px;margin-top:12px;background:white;outline:0}.textarea{min-height:140px;resize:vertical}.pickrow{display:flex;gap:8px;margin-top:12px}.pick{flex:1;padding:11px;border:1px solid #f1e2d6;border-radius:13px;background:white;font-weight:800}.photo{display:block;margin-top:12px;border:1px dashed #e7cfc0;border-radius:15px;padding:14px;text-align:center;color:#9b8475}.photo input{display:none}.preview{display:none;width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-top:10px}.preview-row{display:flex;gap:8px}.preview-row .preview{width:50%}.compress{display:none;font-size:11px;color:#a18b7c;margin-top:7px}.submit{width:100%;height:48px;margin-top:12px;border:0;border-radius:15px;background:#f58f92;color:white;font-weight:900}.detail{font-size:15px;line-height:1.75;white-space:pre-wrap;margin-top:18px}.detail-link{display:block;margin-top:15px;padding:12px 14px;background:#fff2df;border-radius:13px;color:#a87528;text-decoration:none;font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.detail-photo{display:none;width:100%;max-height:360px;object-fit:contain;border-radius:15px;margin-top:15px;background:#f4ebe4}.detail-photo+.detail-photo{margin-top:8px}.actions{display:flex;gap:7px;margin-top:18px}.actions button{flex:1;height:42px;border:0;border-radius:13px;font-weight:800}.edit{background:#f6e8df;color:#80695a}.del{background:#eee2df;color:#9a6e67}.comment{position:relative;border-top:1px solid #f1e2d6;padding:11px 42px 11px 0}.comment:first-child{border-top:0}.comment-delete{position:absolute;right:0;top:10px;border:0;background:none;color:#b7a298;font-size:11px;padding:4px 2px}.comment-form{display:flex;gap:7px;margin-top:12px}.comment-form input{flex:1;min-width:0;border:1px solid #f1e2d6;border-radius:13px;padding:11px}.comment-form button{border:0;border-radius:13px;background:#f58f92;color:#fff;padding:0 15px;font-weight:800}.chat-modal{display:none;position:fixed;inset:0;background:#0006;z-index:20;align-items:center;justify-content:center;padding:14px;box-sizing:border-box}.chat-sheet{width:100%;height:min(88vh,760px);max-width:520px;background:#fffaf6;border-radius:24px;overflow:hidden;box-shadow:0 12px 40px #0004;display:flex;flex-direction:column}.chat-head{height:58px;flex:0 0 58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #f1e2d6;background:#fffaf6;font-weight:900}.chat-head button{border:0;background:none;font-size:25px;color:#8c7567}.chat-frame{border:0;width:100%;height:100%;background:#fbf4ec}.chat-open{margin:0 12px 10px;padding:9px 12px;border-radius:12px;border:1px solid #f1e2d6;background:white;color:#8a7060;font-weight:800}</style></head><body><main class="app"><header class="top"><a class="back" href="https://sooyachoco.github.io/Gomlife/">‹ 곰라이프</a><div class="top-title">오늘 하루 어땠어?</div><button id="identityBtn" style="border:0;background:none;color:#8a7060;font-size:12px;font-weight:800"></button></header><section class="hero" id="heroChat" role="button" tabindex="0" aria-label="채팅 열기"><img src="community-hero.jpg" alt="우리 둘의 작은 공간"></section><nav class="tabs"><button class="tab active" data-board="지연">🐻 지연의 이야기</button><button class="tab" data-board="여기 가자!">📍 여기 가자!</button><button class="tab" data-board="승수">🐰 승수의 이야기</button></nav><section class="feed" id="feed"></section><div class="empty" id="empty">아직 남겨진 이야기가 없어요.<br>첫 번째 이야기를 남겨볼까요? ♡</div><button class="more" id="more">더 많은 이야기 보기</button><button class="write" id="write" aria-label="이야기 남기기" title="이야기 남기기">✏️</button></main><div class="chat-modal" id="chatModal"><div class="chat-sheet"><div class="chat-head"><span>💬 편안하게 대화해요</span><button id="chatClose" aria-label="채팅 닫기">×</button></div><iframe class="chat-frame" id="chatFrame" title="곰챗" src="https://gomchat.sooyachoco.workers.dev/"></iframe><button class="chat-open" id="chatOpen" type="button">채팅 페이지로 열기 ↗</button></div></div><div class="modal" id="identityModal"><div class="sheet identity"><h2>누구인가요?</h2><p>이 기기에서 사용할 이름을 한 번만 선택해주세요.</p><div class="identity-buttons"><button data-me="지연">🐻 지연</button><button data-me="승수">🐰 승수</button></div></div></div><div class="modal" id="compose"><div class="sheet"><div class="row"><h2 id="formHeading">새 이야기</h2><button onclick="closeModal('compose')">×</button></div><div class="pickrow"><button class="pick" id="currentPick" disabled></button></div><input class="field" id="title" maxlength="100" placeholder="제목을 적어주세요"><textarea class="field textarea" id="content" maxlength="5000" placeholder="이야기를 적어주세요"></textarea><input class="field" id="linkUrl" type="url" placeholder="링크 주소를 입력해주세요 (선택)"><label class="photo">📷 사진 첨부하기 (최대 2장)<input id="photo" type="file" accept="image/*" multiple><div class="preview-row"><img id="preview" class="preview"><img id="preview2" class="preview"></div><div id="compress" class="compress"></div></label><button class="submit" id="submit">이야기 남기기</button></div></div><div class="modal" id="detailModal"><div class="sheet"><div class="row"><h2 id="detailAuthor"></h2><button onclick="closeModal('detailModal')">×</button></div><div class="title" id="detailTitle"></div><div class="time" id="detailTime"></div><img id="detailPhoto" class="detail-photo"><img id="detailPhoto2" class="detail-photo"><div class="detail" id="detailBody"></div><a id="detailLink" class="detail-link" target="_blank" rel="noopener noreferrer"></a><div class="actions"><button class="edit" id="editBtn">수정하기</button><button class="del" id="deleteBtn">삭제하기</button></div><div style="margin-top:24px"><div id="comments"></div><div class="comment-form"><input id="commentInput" placeholder="댓글을 남겨주세요"><button id="commentSubmit">등록</button></div></div></div></div><script>const JIYEON='file_00000000dfa0820996a2aa3262a12309.png',SEUNGSU='file_00000000dfa0820996a2aa3262a12309(1).png';let me=localStorage.getItem('gomlife_me')||'',board='지연',pick='',current=null,imageData='',imageType='',imageData2='',imageType2='',editing=false,page=0,loading=false;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function validUrl(v){try{const u=new URL(v);return u.protocol==='http:'||u.protocol==='https:'}catch{return false}}function avatar(a){return a==='지연'?JIYEON:SEUNGSU}function setIdentity(v){me=v;localStorage.setItem('gomlife_me',v);$('#identityModal').style.display='none';$('#identityBtn').textContent='나: '+v;pick=v;$('#currentPick').textContent=v==='지연'?'🐻 지연':'🐰 승수';load()}function ensureIdentity(){if(me)setIdentity(me);else $('#identityModal').style.display='flex'}function openChat(){const m=$('#chatModal');m.style.display='flex';document.body.style.overflow='hidden'}function closeChat(){const m=$('#chatModal');m.style.display='none';document.body.style.overflow=''}$('#heroChat').onclick=openChat;$('#heroChat').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openChat()}};$('#chatClose').onclick=closeChat;$('#chatModal').onclick=e=>{if(e.target===$('#chatModal'))closeChat()};$('#chatOpen').onclick=()=>window.open('https://gomchat.sooyachoco.workers.dev/','_blank','noopener,noreferrer');$('#more').onclick=()=>load(false);async function load(reset=true){if(loading)return;loading=true;if(reset){page=0;$('#feed').innerHTML='';$('#empty').textContent='아직 남겨진 이야기가 없어요.\n첫 번째 이야기를 남겨볼까요? ♡';$('#more').style.display='none'}try{const r=await fetch('/api/posts?board='+encodeURIComponent(board)+'&limit=30&offset='+(page*30));if(!r.ok)throw new Error();const a=await r.json();$('#empty').style.display=($('#feed').children.length||a.length)?'none':'block';a.forEach(p=>{const e=document.createElement('article');e.className='post';const icon=board==='지연'?'🐻':board==='승수'?'🐰':'📍';const cls=board==='지연'?'g':board==='승수'?'s':'place';e.innerHTML=`<div class="head"><div class="avatar"><img src="${avatar(p.author)}"></div><div><div class="author ${cls}">${icon} ${esc(p.author)}</div><div class="time">${esc(p.created_at)}</div></div></div><div class="post-title-row"><div class="title">${esc(p.title)}</div><span class="comment-count">${Number(p.comment_count)||0}</span></div>${p.link_url?'<div class="post-link">🔗 '+esc(p.link_url)+'</div>':''}`;e.onclick=()=>openPost(p.id);$('#feed').appendChild(e)});page++;$('#more').style.display=r.headers.get('x-has-more')==='1'?'block':'none'}catch(e){if(reset){$('#empty').style.display='block';$('#empty').textContent='글을 불러오지 못했어요.'}}finally{loading=false}}async function openPost(id){try{const r=await fetch('/api/posts?id='+id);if(!r.ok)throw new Error();const p=await r.json();current=p;$('#detailAuthor').textContent=(p.board==='지연'?'🐻 ':p.board==='승수'?'🐰 ':'📍 ')+p.author;$('#detailTitle').textContent=p.title;$('#detailTime').textContent=p.created_at;$('#detailBody').textContent=p.content;$('#detailLink').style.display=p.link_url?'block':'none';$('#detailLink').href=p.link_url||'#';$('#detailLink').textContent=p.link_url||'';setPhoto('#detailPhoto',p.image_data,p.image_type);setPhoto('#detailPhoto2',p.image_data2,p.image_type2);$('#editBtn').style.display=p.author===me?'block':'none';$('#deleteBtn').style.display=p.author===me?'block':'none';await loadComments(id);$('#detailModal').style.display='flex'}catch(e){alert('글을 불러오지 못했어요.')}}function setPhoto(sel,data,type){const e=$(sel);if(data){e.src='data:'+(type||'image/jpeg')+';base64,'+data;e.style.display='block'}else{e.removeAttribute('src');e.style.display='none'}}async function loadComments(id){const r=await fetch('/api/comments?post_id='+id);const a=await r.json();$('#comments').innerHTML=a.map(c=>`<div class="comment"><b>${esc(c.author)}</b> <span>${esc(c.content)}</span>${c.author===me?`<button class="comment-delete" onclick="deleteComment(${c.id})">삭제</button>`:''}</div>`).join('')}async function deleteComment(id){if(!confirm('댓글을 삭제할까요?'))return;await fetch('/api/comments?id='+id,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({author:me})});if(current)loadComments(current.id)}$('#commentSubmit').onclick=async()=>{if(!current)return;const v=$('#commentInput').value.trim();if(!v)return;await fetch('/api/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({post_id:current.id,author:me,content:v})});$('#commentInput').value='';loadComments(current.id);load()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');board=b.dataset.board;load()});document.querySelectorAll('[data-me]').forEach(b=>b.onclick=()=>setIdentity(b.dataset.me));$('#identityBtn').onclick=()=>$('#identityModal').style.display='flex';function closeModal(id){$('#'+id).style.display='none'}$('#write').onclick=()=>{ensureIdentity();if(!me)return;editing=false;current=null;imageData='';imageType='';imageData2='';imageType2='';$('#formHeading').textContent='새 이야기';$('#title').value='';$('#content').value='';$('#linkUrl').value='';$('#preview').style.display='none';$('#preview2').style.display='none';$('#photo').value='';$('#submit').textContent='이야기 남기기';$('#compose').style.display='flex'};function readImage(file,which){return new Promise(resolve=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1400,s=Math.min(1,max/img.width,max/img.height),w=Math.round(img.width*s),h=Math.round(img.height*s),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);const d=c.toDataURL('image/jpeg',.78).split(',')[1];resolve([d,'image/jpeg'])};img.src=r.result};r.readAsDataURL(file)})}$('#photo').onchange=async e=>{const fs=[...e.target.files].slice(0,2);imageData='';imageType='';imageData2='';imageType2='';if(fs[0]){[imageData,imageType]=await readImage(fs[0],1);$('#preview').src='data:'+imageType+';base64,'+imageData;$('#preview').style.display='block'}else $('#preview').style.display='none';if(fs[1]){[imageData2,imageType2]=await readImage(fs[1],2);$('#preview2').src='data:'+imageType2+';base64,'+imageData2;$('#preview2').style.display='block'}else $('#preview2').style.display='none'};$('#submit').onclick=async()=>{const title=$('#title').value.trim(),content=$('#content').value.trim(),link=$('#linkUrl').value.trim();if(!title||!content)return alert('제목과 내용을 입력해주세요.');if(link&&!validUrl(link))return alert('http 또는 https 주소만 입력할 수 있어요.');const body={board,author:me,title,content,link_url:link,image_data:imageData,image_type:imageType,image_data2:imageData2,image_type2:imageType2};let r;if(editing)r=await fetch('/api/posts',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,id:current.id})});else r=await fetch('/api/posts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)return alert('저장하지 못했어요.');closeModal('compose');load()};async function editPost(){if(!current||current.author!==me)return;editing=true;$('#formHeading').textContent='이야기 수정';$('#title').value=current.title;$('#content').value=current.content;$('#linkUrl').value=current.link_url||'';imageData=current.image_data||'';imageType=current.image_type||'';imageData2=current.image_data2||'';imageType2=current.image_type2||'';setPreview('#preview',imageData,imageType);setPreview('#preview2',imageData2,imageType2);$('#submit').textContent='수정하기';closeModal('detailModal');$('#compose').style.display='flex'}function setPreview(sel,data,type){const e=$(sel);if(data){e.src='data:'+(type||'image/jpeg')+';base64,'+data;e.style.display='block'}else{e.removeAttribute('src');e.style.display='none'}}$('#editBtn').onclick=editPost;$('#deleteBtn').onclick=async()=>{if(!current||current.author!==me)return;if(!confirm('이 글을 삭제할까요?'))return;const r=await fetch('/api/posts?id='+current.id,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({author:me})});if(r.ok){closeModal('detailModal');load()}};ensureIdentity();</script></body></html>
