<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community</title>
<style>body{font-family:system-ui;margin:0;background:#fffaf5;color:#463b34}.wrap{max-width:900px;margin:auto;padding:20px}.hero{position:relative;cursor:pointer}.hero img{width:100%;display:block;border-radius:20px}.badge{position:absolute;right:14px;top:14px;min-width:28px;height:28px;border-radius:50%;background:#d85b5b;color:white;font-size:13px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 7px;box-shadow:0 3px 8px #0002}.badge.show{display:flex}.hint{text-align:center;color:#9a897b;font-size:13px;margin:9px 0 20px}.composer{padding:18px;border:1px solid #eadfd4;border-radius:18px;background:#fff}.composer input,.composer textarea{width:100%;box-sizing:border-box;padding:12px;margin:5px 0;border:1px solid #e2d6cb;border-radius:12px;background:#fffaf6}.composer textarea{min-height:120px;resize:vertical}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row button{flex:0 0 auto;padding:12px 18px;border:0;border-radius:12px;background:#85705f;color:#fff}.preview{max-width:100%;max-height:260px;margin-top:8px;border-radius:12px;display:none}.modal{position:fixed;inset:0;background:#0008;z-index:10;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modalbox{position:relative;width:min(520px,100%);height:min(820px,94dvh);background:#fffaf5;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px #0005}.modalbox iframe{width:100%;height:100%;border:0}.close{position:absolute;right:12px;top:12px;z-index:2;width:40px;height:40px;border:0;border-radius:50%;background:#fff;color:#594b42;font-size:22px;box-shadow:0 3px 10px #0003}</style></head>
<body><div class="wrap"><div id="hero" class="hero"><img id="heroImg" src="file_00000000dfa0820996a2aa3262a12309.png" alt="커뮤니티"><span id="unread" class="badge">0</span></div><div class="hint">이미지를 누르면 곰채팅이 열려요 💌</div><div class="composer"><input id="title" placeholder="제목"><textarea id="content" placeholder="이야기를 남겨주세요"></textarea><div class="row"><input id="image" type="file" accept="image/*"><button id="post">등록</button></div><img id="preview" class="preview"></div></div><div id="modal" class="modal"><div class="modalbox"><button class="close" id="close">×</button><iframe id="chat" title="GomChat"></iframe></div></div>
<script>
const API='/api/posts',CHAT='https://gomchat.sooyachoco.workers.dev/';let selectedImage='';
async function compressImage(file){const max=1600,quality=.8;const bitmap=await createImageBitmap(file);let w=bitmap.width,h=bitmap.height;if(Math.max(w,h)>max){const scale=max/Math.max(w,h);w=Math.round(w*scale);h=Math.round(h*scale)}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(bitmap,0,0,w,h);bitmap.close();const blob=await new Promise(r=>canvas.toBlob(r,'image/webp',quality));if(!blob)throw new Error('이미지 압축 실패');const bytes=new Uint8Array(await blob.arrayBuffer());let binary='';const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));return {data:'data:image/webp;base64,'+btoa(binary),type:'image/webp',size:blob.size,width:w,height:h}}
document.querySelector('#image').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{selectedImage=await compressImage(f);document.querySelector('#preview').src=selectedImage.data;document.querySelector('#preview').style.display='block'}catch(err){alert('이미지를 압축하지 못했어요. 다른 이미지를 선택해주세요.');selectedImage=''}};
document.querySelector('#post').onclick=async()=>{const title=document.querySelector('#title').value.trim(),content=document.querySelector('#content').value.trim();if(!title||!content)return alert('제목과 내용을 입력해주세요.');if(selectedImage&&selectedImage.data.length>700000)return alert('압축 후에도 이미지가 너무 커요. 조금 더 작은 이미지를 선택해주세요.');const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({board:'지연',author:'승수',title,content,image_data:selectedImage?.data||'',image_type:selectedImage?.type||''})});if(!r.ok)return alert('등록에 실패했어요.');document.querySelector('#title').value='';document.querySelector('#content').value='';document.querySelector('#image').value='';document.querySelector('#preview').style.display='none';selectedImage='';alert('등록했어요.');};
function openChat(){document.querySelector('#chat').src=CHAT;document.querySelector('#modal').classList.add('open');localStorage.setItem('gomchat-last-open',Date.now());setUnread(0)}function setUnread(n){const b=document.querySelector('#unread');b.textContent=n>99?'99+':n;b.classList.toggle('show',n>0);localStorage.setItem('gomchat-unread',String(n))}function addUnread(){setUnread(Number(localStorage.getItem('gomchat-unread')||0)+1)}document.querySelector('#hero').onclick=openChat;document.querySelector('#close').onclick=()=>{document.querySelector('#modal').classList.remove('open');document.querySelector('#chat').src='about:blank'};document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')document.querySelector('#close').click()};setUnread(Number(localStorage.getItem('gomchat-unread')||0));
</script></body></html>
