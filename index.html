<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 둘의 이야기</title><style>body{margin:0;background:#fbf4ec;color:#5a4437;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh}.top{height:64px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fbf4ec;z-index:2}.back{color:#8a7060;text-decoration:none;font-size:13px;font-weight:800}.top-title{position:absolute;left:50%;transform:translateX(-50%);font-size:19px;font-weight:900;white-space:nowrap}.hero{width:100%;aspect-ratio:2.25/1;overflow:hidden;line-height:0}.hero img{width:100%;height:100%;object-fit:cover;display:block}.tabs{padding:16px 14px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.tab{height:50px;border:1px solid #f1e2d6;border-radius:17px;background:#fffaf6;color:#a18b7c;font-weight:900}.tab.active{background:#ffe4e1;color:#e7777d}.feed{padding:0 14px}.post{background:#fffdfa;border:1px solid #f1e2d6;border-radius:20px;padding:14px;margin-bottom:10px;cursor:pointer}.head{display:flex;align-items:center;gap:11px}.avatar{width:50px;height:50px;border-radius:15px;overflow:hidden;background:#f8e8d9}.avatar img{width:100%;height:100%;object-fit:cover}.author{font-size:13px;font-weight:900}.g{color:#e27b80}.s{color:#6f91c5}.time{font-size:11px;color:#b09b8e;margin-top:2px}.title{font-size:17px;font-weight:800;margin-top:12px;line-height:1.4}.write{margin:14px;width:calc(100% - 28px);height:54px;border:0;border-radius:20px;background:#f58f92;color:white;font-weight:900;font-size:16px}.empty{text-align:center;padding:40px;color:#a99284}.modal{display:none;position:fixed;inset:0;background:#0004;z-index:5;align-items:flex-end}.sheet{width:100%;max-width:520px;margin:auto;background:#fffaf6;border-radius:28px 28px 0 0;padding:20px 18px 25px;box-sizing:border-box;max-height:92vh;overflow:auto}.row{display:flex;justify-content:space-between;align-items:center}.row button{border:0;background:none;font-size:24px;color:#8c7567}.field{width:100%;box-sizing:border-box;border:1px solid #f1e2d6;border-radius:15px;padding:13px;margin-top:12px;background:white;outline:0}.textarea{min-height:140px;resize:vertical}.pickrow{display:flex;gap:8px;margin-top:12px}.pick{flex:1;padding:11px;border:1px solid #f1e2d6;border-radius:13px;background:white;font-weight:800}.pick.selected{background:#ffe4e1;border-color:#ffc9c6}.photo{display:block;margin-top:12px;border:1px dashed #e7cfc0;border-radius:15px;padding:14px;text-align:center;color:#9b8475}.photo input{display:none}.preview{display:none;width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-top:10px}.compress{display:none;font-size:11px;color:#a18b7c;margin-top:7px}.submit{width:100%;height:48px;margin-top:12px;border:0;border-radius:15px;background:#f58f92;color:white;font-weight:900}.detail{font-size:15px;line-height:1.75;white-space:pre-wrap;margin-top:18px}.detail-photo{display:none;width:100%;max-height:360px;object-fit:contain;border-radius:15px;margin-top:15px;background:#f4ebe4}.actions{display:flex;gap:7px;margin-top:18px}.actions button{flex:1;height:42px;border:0;border-radius:13px;font-weight:800}.edit{background:#f6e8df;color:#80695a}.del{background:#eee2df;color:#9a6e67}.comment{position:relative;border-top:1px solid #f1e2d6;padding:11px 42px 11px 0}.comment:first-child{border-top:0}.comment-delete{position:absolute;right:0;top:10px;border:0;background:none;color:#b7a298;font-size:11px;padding:4px 2px}.comment-form{display:flex;gap:7px;margin-top:12px}.comment-form input{flex:1;min-width:0;border:1px solid #f1e2d6;border-radius:13px;padding:11px}.comment-form button{border:0;border-radius:13px;background:#f58f92;color:#fff;padding:0 15px;font-weight:800}</style></head><body><main class="app"><header class="top"><a class="back" href="https://sooyachoco.github.io/Gomlife/">‹ 곰라이프</a><div class="top-title">♡ 우리 둘의 이야기 ♡</div><div></div></header><section class="hero"><img src="file_00000000d558820993006dc10ae26a8f.png" alt="우리 둘의 작은 공간"></section><nav class="tabs"><button class="tab active" data-author="지연">🐻 지연의 이야기</button><button class="tab" data-author="승수">🐰 승수의 이야기</button></nav><section class="feed" id="feed"></section><div class="empty" id="empty">아직 남겨진 이야기가 없어요.<br>첫 번째 이야기를 남겨볼까요? ♡</div><button class="write" id="write">✏️ 이야기 남기기</button></main><div class="modal" id="compose"><div class="sheet"><div class="row"><h2 id="formHeading">새 이야기</h2><button onclick="closeModal('compose')">×</button></div><div class="pickrow"><button class="pick selected" data-pick="지연">🐻 지연</button><button class="pick" data-pick="승수">🐰 승수</button></div><input class="field" id="title" maxlength="100" placeholder="제목을 적어주세요"><textarea class="field textarea" id="content" maxlength="5000" placeholder="이야기를 적어주세요"></textarea><label class="photo">📷 사진 첨부하기<input id="photo" type="file" accept="image/*"><img id="preview" class="preview"><div id="compress" class="compress"></div></label><button class="submit" id="submit">이야기 남기기</button></div></div><div class="modal" id="detailModal"><div class="sheet"><div class="row"><h2 id="detailAuthor"></h2><button onclick="closeModal('detailModal')">×</button></div><div class="title" id="detailTitle"></div><div class="time" id="detailTime"></div><img id="detailPhoto" class="detail-photo"><div class="detail" id="detailBody"></div><div class="actions"><button class="edit" id="editBtn">수정하기</button><button class="del" id="deleteBtn">삭제하기</button></div><div style="margin-top:24px"><div id="comments"></div><div class="comment-form"><input id="commentInput" placeholder="댓글을 남겨주세요"><button id="commentSubmit">등록</button></div></div></div></div><script>const JIYEON='file_00000000dfa0820996a2aa3262a12309.png',SEUNGSU='file_00000000dfa0820996a2aa3262a12309(1).png';let author='지연',pick='지연',current=null,imageData='',imageType='',editing=false;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function avatar(a){return a==='지연'?JIYEON:SEUNGSU}async function load(){try{const r=await fetch('/api/posts?author='+encodeURIComponent(author));const a=await r.json();$('#feed').innerHTML='';$('#empty').style.display=a.length?'none':'block';a.forEach(p=>{const e=document.createElement('article');e.className='post';e.innerHTML=`<div class="head"><div class="avatar"><img src="${avatar(p.author)}"></div><div><div class="author ${p.author==='지연'?'g':'s'}">${esc(p.author)}</div><div class="time">${esc(p.created_at)}</div></div></div><div class="title">${esc(p.title)}</div>`;e.onclick=()=>openPost(p);$('#feed').appendChild(e)})}catch(e){$('#empty').style.display='block';$('#empty').textContent='글을 불러오지 못했어요.'}}function openPost(p){current=p;$('#detailAuthor').textContent=(p.author==='지연'?'🐻 ':'🐰 ')+p.author;$('#detailTitle').textContent=p.title;$('#detailTime').textContent=p.created_at;$('#detailBody').textContent=p.content;const img=$('#detailPhoto');if(p.image_data){img.src='data:'+(p.image_type||'image/jpeg')+';base64,'+p.image_data;img.style.display='block'}else img.style.display='none';$('#detailModal').style.display='flex';loadComments()}async function loadComments(){const r=await fetch('/api/comments?post_id='+current.id),a=await r.json();$('#comments').innerHTML=a.length?a.map(c=>`<div class="comment"><b>${esc(c.author)}</b><div>${esc(c.content)}</div><button class="comment-delete" data-id="${c.id}">삭제</button></div>`).join(''):'<div class="time" style="margin-top:10px">첫 댓글을 남겨보세요.</div>';document.querySelectorAll('.comment-delete').forEach(b=>b.onclick=async()=>{if(!confirm('이 댓글을 삭제할까요?'))return;const r=await fetch('/api/comments?id='+b.dataset.id,{method:'DELETE'});if(r.ok)loadComments()})}function closeModal(id){$('#'+id).style.display='none'}function resetForm(){imageData='';imageType='';$('#title').value='';$('#content').value='';$('#photo').value='';$('#preview').style.display='none';$('#compress').style.display='none'}function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const max=1200,scale=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*scale),h=Math.round(im.height*scale),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);let q=.78;function make(){c.toBlob(b=>{if(!b)return reject();if(b.size>500000&&q>.45){q-=.08;make()}else{const fr=new FileReader();fr.onload=()=>resolve({data:String(fr.result).split(',')[1],type:'image/jpeg',size:b.size});fr.readAsDataURL(b)}},'image/jpeg',q)}make()};im.onerror=reject;im.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}$('#write').onclick=()=>{editing=false;$('#formHeading').textContent='새 이야기';$('#submit').textContent='이야기 남기기';pick=author;document.querySelectorAll('.pick').forEach(x=>x.classList.toggle('selected',x.dataset.pick===pick));resetForm();$('#compose').style.display='flex'};function startEdit(){editing=true;closeModal('detailModal');$('#formHeading').textContent='이야기 수정';$('#submit').textContent='수정하기';pick=current.author;document.querySelectorAll('.pick').forEach(x=>x.classList.toggle('selected',x.dataset.pick===pick));$('#title').value=current.title;$('#content').value=current.content;imageData=current.image_data||'';imageType=current.image_type||'';if(imageData){$('#preview').src='data:'+imageType+';base64,'+imageData;$('#preview').style.display='block'}$('#compose').style.display='flex'}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{author=b.dataset.author;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));load()});document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{pick=b.dataset.pick;document.querySelectorAll('.pick').forEach(x=>x.classList.toggle('selected',x===b))});$('#photo').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#compress').style.display='block';$('#compress').textContent='사진을 압축하는 중...';try{const x=await compressImage(f);imageData=x.data;imageType=x.type;$('#preview').src='data:'+imageType+';base64,'+imageData;$('#preview').style.display='block';$('#compress').textContent='자동 압축 완료 · '+Math.round(x.size/1024)+'KB'}catch{$('#compress').textContent='사진을 처리하지 못했어요.'}};$('#submit').onclick=async()=>{const title=$('#title').value.trim(),content=$('#content').value.trim();if(!title||!content)return alert('제목과 내용을 입력해주세요.');const body={author:pick,title,content,image_data:imageData,image_type:imageType};if(editing)body.id=current.id;const r=await fetch('/api/posts',{method:editing?'PUT':'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});if(!r.ok){const x=await r.json().catch(()=>({}));return alert(x.error||'저장하지 못했어요.')}resetForm();closeModal('compose');editing=false;author=pick;load()};$('#editBtn').onclick=startEdit;$('#deleteBtn').onclick=async()=>{if(!current||!confirm('이 글을 삭제할까요?'))return;const r=await fetch('/api/posts?id='+current.id,{method:'DELETE'});if(r.ok){closeModal('detailModal');load()}else alert('삭제하지 못했어요.')};$('#commentSubmit').onclick=async()=>{const content=$('#commentInput').value.trim();if(!content)return;const r=await fetch('/api/comments',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({post_id:current.id,author,content})});if(r.ok){$('#commentInput').value='';loadComments()}};load();</script></body></html>
