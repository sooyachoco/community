<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf4ec">
<title>우리 둘의 이야기</title>
<style>
:root{--bg:#fbf4ec;--card:#fffdfa;--ink:#5a4437;--muted:#a28b7b;--pink:#f58f92;--pink-soft:#ffe4e1;--blue:#6f91c5;--line:#f1e2d6;--shadow:0 8px 26px rgba(117,76,48,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}button,input,textarea{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}.app{width:100%;max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:34px}.top{position:sticky;top:0;z-index:10;height:64px;padding:0 14px;background:rgba(251,244,236,.96);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(241,226,214,.65)}.back{display:flex;align-items:center;gap:4px;padding:9px 8px;border-radius:14px;color:#8a7060;font-size:13px;font-weight:800;text-decoration:none}.back:active{background:#f5e9df}.back svg{width:18px;height:18px}.top-title{font-size:19px;font-weight:900;letter-spacing:-.07em;position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}.heart{width:36px;height:36px;border:1px solid #f3ddd1;border-radius:50%;display:grid;place-items:center;background:#fffaf5;color:#f28b8e}.heart svg{width:18px}
.hero{width:100%;height:auto;aspect-ratio:2.25/1;overflow:hidden;line-height:0;background:transparent;margin:0 0 14px}.hero img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;transform:scale(1.13)}
.tabs{padding:0 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}.tab{height:50px;border-radius:17px;border:1px solid var(--line);background:#fffaf6;color:#a18b7c;font-size:14px;font-weight:900}.tab.active{background:var(--pink-soft);border-color:#ffd0cc;color:#e7777d}.feed{padding:0 14px}.post{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer}.post-head{display:flex;align-items:center;gap:11px}.avatar{width:50px;height:50px;border-radius:15px;overflow:hidden;flex:0 0 auto;background:#f8e8d9}.avatar img{width:100%;height:100%;display:block;object-fit:cover}.author{font-size:13px;font-weight:900}.author.g{color:#e27b80}.author.s{color:var(--blue)}.time{margin-top:2px;font-size:11px;color:#b09b8e}.more{margin-left:auto;font-size:19px;color:#b09b8e;padding:4px}.title{font-size:17px;font-weight:800;letter-spacing:-.055em;margin:12px 0 11px;line-height:1.4}.body-preview{font-size:13px;color:#90796a;line-height:1.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:10px}.meta{display:flex;gap:18px;color:#b09b8e;font-size:12px;border-top:1px solid #f4e8df;padding-top:10px}.meta span{display:flex;align-items:center;gap:5px}.meta .love{color:#ef8d91}.write{position:sticky;bottom:16px;margin:14px 14px 0;height:54px;width:calc(100% - 28px);border-radius:20px;background:linear-gradient(135deg,#f69a9c,#f4868b);color:white;font-size:16px;font-weight:900;box-shadow:0 12px 24px rgba(239,133,139,.25)}.empty{text-align:center;padding:48px 20px;color:#a99284}.empty strong{display:block;color:#80695b;font-size:16px;margin-bottom:7px}.modal{display:none;position:fixed;inset:0;z-index:30;background:rgba(67,45,35,.3);align-items:flex-end}.sheet{width:100%;max-width:520px;margin:auto;background:#fffaf6;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px rgba(72,44,28,.15);max-height:88vh;overflow:auto}.sheet-top{display:flex;justify-content:space-between;align-items:center}.sheet h2{font-size:19px;margin:0}.close{font-size:24px;color:#9b8475}.field{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:13px 14px;outline:none;margin-top:12px}.field:focus{border-color:#f3b1af}.textarea{min-height:140px;resize:vertical}.author-pick{display:flex;gap:8px;margin-top:12px}.pick{flex:1;padding:10px;border:1px solid var(--line);border-radius:13px;background:#fff;font-weight:800}.pick.selected{background:var(--pink-soft);border-color:#ffc9c6}.submit{width:100%;height:48px;margin-top:12px;border-radius:15px;background:#f58f92;color:#fff;font-weight:900}.detail-title{font-size:22px;line-height:1.4;margin:18px 0 10px}.detail-body{font-size:15px;line-height:1.75;white-space:pre-wrap}.comments{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}.comment{padding:11px 0;border-bottom:1px solid #f3e7de}.comment-author{font-size:12px;font-weight:900}.comment-body{font-size:13px;line-height:1.55;margin-top:4px;white-space:pre-wrap}.comment-form{display:flex;gap:7px;margin-top:12px}.comment-form input{min-width:0;flex:1;border:1px solid var(--line);border-radius:13px;padding:11px 12px;outline:none}.comment-form button{padding:0 15px;border-radius:13px;background:#f58f92;color:#fff;font-weight:800}.danger{color:#c27d78;font-size:12px;margin-top:14px}@media(min-width:521px){body{background:#f1e7de}.app{background:var(--bg);box-shadow:0 0 50px rgba(77,52,35,.08)}}
</style>
</head>
<body>
<main class="app">
<header class="top"><a class="back" href="https://sooyachoco.github.io/Gomlife/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg><span>곰라이프</span></a><div class="top-title">♡ 우리 둘의 이야기 ♡</div><button class="heart">♥</button></header>
<section class="hero"><img src="https://raw.githubusercontent.com/sooyachoco/Gomlife/main/community/file_00000000d558820993006dc10ae26a8f.png" alt="우리 둘의 작은 공간"></section>
<nav class="tabs"><button class="tab active" data-author="지연">🐻 지연의 이야기</button><button class="tab" data-author="승수">🐰 승수의 이야기</button></nav>
<section class="feed" id="feed"></section><div class="empty" id="empty">아직 남겨진 이야기가 없어요.<br><strong>첫 번째 이야기를 남겨볼까요? ♡</strong></div><button class="write" id="write">✏️ 이야기 남기기</button>
</main>
<div class="modal" id="compose"><div class="sheet"><div class="sheet-top"><h2>새 이야기</h2><button class="close" data-close="compose">×</button></div><input class="field" id="postTitle" maxlength="100" placeholder="제목을 적어주세요"><textarea class="field textarea" id="postBody" maxlength="5000" placeholder="오늘의 이야기를 적어주세요."></textarea><div class="author-pick"><button class="pick selected" data-pick="지연">🐻 지연</button><button class="pick" data-pick="승수">🐰 승수</button></div><button class="submit" id="submit">이야기 남기기</button></div></div>
<div class="modal" id="detail"><div class="sheet"><div class="sheet-top"><h2 id="detailAuthor"></h2><button class="close" data-close="detail">×</button></div><div class="detail-title" id="detailTitle"></div><div class="time" id="detailTime"></div><div class="detail-body" id="detailBody"></div><div class="comments"><strong>댓글</strong><div id="commentList"></div><div class="comment-form"><input id="commentInput" maxlength="1000" placeholder="댓글을 남겨주세요"><button id="commentSubmit">등록</button></div></div><button class="danger" id="deletePost">이 글 삭제</button></div></div>
<script>
const API='/api';let currentAuthor='지연',selectedAuthor='지연',currentPost=null;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function ago(v){const d=new Date(v),n=new Date(),m=Math.floor((n-d)/60000);if(m<1)return'방금 전';if(m<60)return m+'분 전';if(m<1440)return Math.floor(m/60)+'시간 전';if(m<2880)return'어제';return d.toLocaleDateString('ko-KR')}
async function load(){const r=await fetch(API+'/posts?author='+encodeURIComponent(currentAuthor));const data=await r.json();const feed=$('#feed');feed.innerHTML='';$('#empty').style.display=data.length?'none':'block';data.forEach(p=>{const el=document.createElement('article');el.className='post';el.innerHTML=`<div class="post-head"><div class="avatar"><img src="${p.author==='지연'?'https://raw.githubusercontent.com/sooyachoco/Gomlife/main/community/file_00000000dfa0820996a2aa3262a12309.png':'https://raw.githubusercontent.com/sooyachoco/Gomlife/main/community/file_00000000dfa0820996a2aa3262a12309(1).png'}"></div><div><div class="author ${p.author==='지연'?'g':'s'}">${esc(p.author)}</div><div class="time">${ago(p.created_at)}</div></div></div><div class="title">${esc(p.title)}</div><div class="body-preview">${esc(p.content)}</div><div class="meta"><span class="love">♡ ${p.likes||0}</span><span>○ ${p.comment_count||0}</span></div>`;el.onclick=()=>openDetail(p);feed.appendChild(el)}).catch(()=>{$('#empty').innerHTML='<strong>불러오지 못했어요.</strong>잠시 후 다시 시도해주세요.'});}
function openDetail(p){currentPost=p;$('#detailAuthor').textContent=(p.author==='지연'?'🐻 ':'🐰 ')+p.author;$('#detailTitle').textContent=p.title;$('#detailTime').textContent=ago(p.created_at);$('#detailBody').textContent=p.content;$('#detail').style.display='flex';loadComments()}
async function loadComments(){const r=await fetch(API+'/comments?post_id='+currentPost.id),data=await r.json();$('#commentList').innerHTML=data.length?data.map(c=>`<div class="comment"><div class="comment-author">${c.author==='지연'?'🐻':'🐰'} ${esc(c.author)} · ${ago(c.created_at)}</div><div class="comment-body">${esc(c.content)}</div></div>`).join(''):'<div class="time" style="margin-top:12px">첫 댓글을 남겨보세요.</div>'}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{currentAuthor=b.dataset.author;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));load()});$('#write').onclick=()=>{$('#compose').style.display='flex'};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{$('#'+b.dataset.close).style.display='none'});document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{selectedAuthor=b.dataset.pick;document.querySelectorAll('.pick').forEach(x=>x.classList.toggle('selected',x===b))});
$('#submit').onclick=async()=>{const title=$('#postTitle').value.trim(),content=$('#postBody').value.trim();if(!title||!content)return alert('제목과 내용을 입력해주세요.');const r=await fetch(API+'/posts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({author:selectedAuthor,title,content})});if(!r.ok)return alert('저장하지 못했어요.');$('#postTitle').value='';$('#postBody').value='';$('#compose').style.display='none';currentAuthor=selectedAuthor;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.author===currentAuthor));load()};
$('#commentSubmit').onclick=async()=>{const content=$('#commentInput').value.trim();if(!content||!currentPost)return;const r=await fetch(API+'/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({post_id:currentPost.id,author:currentAuthor,content})});if(r.ok){$('#commentInput').value='';loadComments()}};
$('#deletePost').onclick=async()=>{if(!currentPost||!confirm('이 글을 삭제할까요?'))return;const r=await fetch(API+'/posts?id='+currentPost.id,{method:'DELETE'});if(r.ok){$('#detail').style.display='none';load()}};
load();
</script>
</body></html>
